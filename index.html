<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<!-- iPhone：ホーム画面から開いたとき、Safari のバーを出さずに黒い画面いっぱいで開く -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="音なしPV">
<title>音なしPV</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- YouTube の公式埋め込みプレーヤーが入る -->
<div id="playerWrap"><div id="player"></div></div>

<!-- 画面へのタップを受ける透明な板（YouTube 側の操作画面を出さない） -->
<div id="tap"></div>

<!-- 最初の案内・エラー表示 -->
<div id="msg"></div>

<!-- 曲が変わったときに数秒だけ出す曲名 -->
<div id="caption"><b id="capArtist"></b><span id="capTitle"></span></div>

<!-- 短い案内（iPhone のヒントなど） -->
<div id="toast"></div>

<!-- タップで出る操作ボタン（5秒で消える） -->
<div id="bar" class="hide">
  <button id="btnNext" type="button" aria-label="次の動画">
    <svg viewBox="0 0 24 24"><path d="M5 5l10 7-10 7z"/><path d="M19 5v14"/></svg>
  </button>
  <button id="btnZoom" type="button" aria-label="表示の大きさ（全体／画面いっぱい／拡大）">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M8 10l-2 2 2 2M16 10l2 2-2 2"/></svg>
  </button>
  <button id="btnSnd" type="button" aria-label="音のオン・オフ">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path class="x" d="M16 10l4 4M20 10l-4 4"/></svg>
  </button>
  <button id="btnWake" type="button" aria-label="画面消灯防止">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
  </button>
  <button id="btnFs" type="button" aria-label="全画面">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="btnSet" type="button" aria-label="設定">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
  </button>
</div>

<!-- 設定 -->
<div id="settings">
  <form id="setForm">
    <h1>設定</h1>

    <label for="fArtists">アーティスト（1行に1人）</label>
    <textarea id="fArtists" rows="4" placeholder="例：&#10;YOASOBI&#10;Official髭男dism"></textarea>

    <label for="fSuffix">検索に付ける言葉</label>
    <select id="fSuffix">
      <option value="MV">MV</option>
      <option value="official music video">official music video</option>
      <option value="">付けない</option>
    </select>

    <label for="fKey">YouTube API キー（アーティスト検索に必要）</label>
    <input id="fKey" type="text" autocomplete="off" spellcheck="false" placeholder="AIza…">

    <label for="fUrls">YouTube のURL（任意。キーなしでも使える）</label>
    <textarea id="fUrls" rows="3" placeholder="動画やプレイリストのURLを1行に1つ"></textarea>

    <div class="btns">
      <button type="button" id="btnShare">共有リンクを作る</button>
      <button type="button" id="btnRefresh">検索し直す</button>
      <button type="button" id="btnCancel">閉じる</button>
      <button type="submit" class="primary">保存して再生</button>
    </div>
    <p class="note" id="setNote"></p>
  </form>
</div>

<!-- 共有リンク（検索で見つけた動画をキーなしで渡す） -->
<div id="share">
  <div class="shareBox">
    <div id="shareQr"></div>
    <div class="shareSide">
      <h1>共有リンク（キーなし）</h1>
      <p class="note" id="shareInfo"></p>
      <textarea id="shareUrl" rows="3" readonly></textarea>
      <div class="btns">
        <button type="button" id="btnShareSend">LINEなどで送る</button>
        <button type="button" id="btnShareCopy">コピー</button>
        <button type="button" id="btnShareClose" class="primary">閉じる</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
